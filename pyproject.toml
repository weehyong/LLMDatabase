[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmdb"
version = "0.1.0"
description = "An OpenClaw-inspired DBMS for agentic LLM applications"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["database", "llm", "natural-language", "sql", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Zero required dependencies — all stdlib.
# Optional: an LLM API key enables the full natural-language layer.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[project.scripts]
llmdb = "llmdb.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmdb*"]
