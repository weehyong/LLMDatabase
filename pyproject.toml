[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmdb"
version = "0.1.0"
description = "A database management system reimagined for agentic applications"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "click>=8.1.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
llmdb = "llmdb.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmdb*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
